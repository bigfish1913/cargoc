name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Rust stable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CARGO_TERM_COLOR: always
      # Invoke native Cargo, never the optional cargoc shim.
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Isolate Cargo outputs
        shell: bash
        run: |
          printf '%s\n' "CARGO_TARGET_DIR=$RUNNER_TEMP/cargoc-target" \
            "CARGO_BUILD_BUILD_DIR=$RUNNER_TEMP/cargoc-build" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install MSRV
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Isolate Cargo outputs
        shell: bash
        run: printf '%s\n' "CARGO_TARGET_DIR=$RUNNER_TEMP/cargoc-msrv" >> "$GITHUB_ENV"
      - name: Check all targets on MSRV
        run: cargo check --locked --all-targets
