[package]
name = "cargoc"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Cargo wrapper with managed intermediate caches and safe disk-pressure cleanup"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bigfish1913/cargoc"
homepage = "https://github.com/bigfish1913/cargoc"
documentation = "https://docs.rs/cargoc"
keywords = ["cargo", "cache", "build", "cleanup", "cli"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"

[profile.release]
strip = true
lto = "thin"

[profile.dev]
debug = 1
