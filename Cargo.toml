[package]
name = "cargoc"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "Cargo wrapper with managed intermediate caches and safe disk-pressure cleanup"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bigfish1913/cargoc"
homepage = "https://github.com/bigfish1913/cargoc"
documentation = "https://docs.rs/cargoc"
keywords = ["cargo", "cache", "build", "cleanup", "cli"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ bin }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
flate2 = "1.1"
fs2 = "0.4"
semver = "1"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls", "proxy-from-env"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
self-replace = "1.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"

[profile.release]
strip = true
lto = "thin"

[profile.dev]
debug = 1
